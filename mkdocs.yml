site_name: Gun Game Documentation
site_description: Guides and API reference for the Gun Game Roblox FPS.
site_url: https://099ersf2.github.io/Mango-Shark-Documentation/
repo_url: https://github.com/099ersf2/Mango-Shark-Documentation
repo_name: 099ersf2/Mango-Shark-Documentation
edit_uri: edit/main/Gun%20Game/

docs_dir: Gun Game
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

nav:
  - Home: index.md
  - Get started:
      - AI coding guide: AI_CODING_GUIDE.md
      - Claude project context: CLAUDE.md
      - Code map: CODE_MAP.md
      - Documentation authoring: DOC_TEMPLATE.md
      - Next steps: NEXT_STEPS.md
  - Game:
      - Siege: SIEGE.md
      - Matchmaking and parties: MATCHMAKING.md
      - Recruit Training: TUTORIAL.md
      - Lobby: LOBBY.md
      - Clear House: CLEAR_HOUSE.md
      - UI: UI.md
      - Movement and camera: MOVEMENT.md
      - Music: MUSIC.md
      - Death screen and spectating: DEATH_SCREEN.md
      - Kill feed: KILL_FEED.md
  - Combat systems:
      - Guns:
          - Gun system: GUN_SYSTEM.md
          - Adding guns: ADDING_GUNS.md
          - Third-person gun animation: THIRD_PERSON_GUNS.md
          - Gun animation range: GUN_SHOWCASE.md
          - Aim assist: AIM_ASSIST.md
      - Siege classes: CLASSES.md
      - Scout drones: DRONES.md
      - Breakables: BREAKABLES.md
      - Soft walls: SOFTWALLS.md
      - Consumables: CONSUMABLES.md
      - NPCs:
          - Adding NPCs: ADDING_NPCS.md
          - Siege bots: SIEGE_BOTS.md
  - Progression and economy:
      - Progression and retention: PROGRESSION.md
      - Battle pass and quests: BATTLE_PASS.md
      - Store, currencies, crates, and stats: STORE.md
      - Weapon skins: SKINS.md
      - Analytics: ANALYTICS.md
  - API:
      - api/index.md
      - Cookbook: api/cookbook.md
      - Foundations:
          - Modules and loading: api/foundations/modules.md
          - Extension points: api/foundations/extensions.md
          - Networking with Packets: api/foundations/packets.md
          - Player data and content: api/foundations/data-and-content.md
          - Effects and sound: api/foundations/effects.md
          - Handlers and helpers: api/foundations/helpers.md
      - Game systems:
          - Siege match: api/systems/siege.md
          - Matchmaking and parties: api/systems/matchmaking.md
          - Classes and abilities: api/systems/classes.md
          - Class abilities: api/systems/abilities.md
          - Drones and cameras: api/systems/drones-cameras.md
          - Guns: api/systems/guns.md
          - Movement and camera: api/systems/movement.md
          - Combat and damage: api/systems/combat.md
          - "World: boards, soft walls, grenades": api/systems/world.md
          - NPCs and bots: api/systems/npcs.md
          - Lobby, teleporters and gun range: api/systems/lobby.md
          - Progression and economy: api/systems/progression.md
          - Progress, leaderboards, analytics: api/systems/progress-analytics.md
          - Settings and keybinds: api/systems/settings.md
          - "Client: menus, HUD, screens": api/systems/client.md
      - Reference:
          - All extension points: api/reference/extension-points.md
          - All packets: api/reference/packets.md
          - Attributes, tags and collision groups: api/reference/attributes.md
          - Admin commands (Cmdr): api/reference/commands.md
          - Legacy APIs: api/reference/legacy.md
