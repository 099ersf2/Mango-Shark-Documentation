site_name: Mango Shark Documentation
site_description: Mango Shark Studio's games, game templates and drop-in systems for Roblox.
site_url: https://099ersf2.github.io/Mango-Shark-Documentation/
repo_url: https://github.com/099ersf2/Mango-Shark-Documentation
repo_name: 099ersf2/Mango-Shark-Documentation
edit_uri: edit/main/

docs_dir: home
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

extra_css:
  - Gun Game/stylesheets/extra.css

plugins:
  - search:
      lang: en

hooks:
  - hooks/multi_root.py

nav:
  - Home: index.md
  - Gun Game:
